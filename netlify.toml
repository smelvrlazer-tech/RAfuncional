# Publicação no Netlify (plano grátis). As variáveis VITE_* são configuradas no painel do Netlify
# (Site configuration → Environment variables), nunca neste arquivo.
[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# App de página única: qualquer rota abre o index.html (o react-router resolve no navegador).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# O service worker precisa ser sempre revalidado, senão o app instalado demora a atualizar.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
